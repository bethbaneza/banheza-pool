<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banheza Pool</title>
  <meta name="description" content="Diagnóstico, dosagem e gestão de clientes para manutenção de piscinas." />
  <meta name="theme-color" content="#001030" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script>
    // Aplica o tema salvo antes do CSS pintar a tela, pra não piscar escuro→claro (ou o
    // contrário) no primeiro instante de carregamento.
    try {
      var temaSalvo = localStorage.getItem('bp_tema');
      if (temaSalvo === 'light' || temaSalvo === 'dark') document.documentElement.setAttribute('data-theme', temaSalvo);
    } catch (e) { /* localStorage indisponível — segue com o tema padrão */ }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/volume.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/diagnostics.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/db.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => { /* offline opcional — não bloqueia o app */ });
      });
    }
  </script>
</body>
</html>
